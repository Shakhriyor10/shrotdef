<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shrot Savdo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f6f8);
      --text-color: var(--tg-theme-text-color, #1f2937);
      --hint-color: var(--tg-theme-hint-color, #6b7280);
      --header-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-bg: var(--tg-theme-button-color, #0f766e);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: var(--tg-theme-section-separator-color, #d1d5db);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background .2s ease, color .2s ease;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg-color);
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }

    .login-card {
      width: min(100%, 420px);
    }

    header {
      background: var(--header-bg);
      color: var(--text-color);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-toggle {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      padding: 0;
    }

    .brand-logo {
      height: 44px;
      width: auto;
      max-width: 100%;
      display: inline-block;
      object-fit: contain;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-color);
      line-height: 1;
      white-space: nowrap;
    }

    .container {
      padding: 14px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      border-right: 1px solid var(--border-color);
      padding-right: 14px;
      transition: all .2s ease;
    }

    .main-area {
      overflow: auto;
      padding-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    button { border: none; border-radius: 12px; cursor: pointer; }

    .menu-btn {
      background: var(--card-bg);
      box-shadow: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-weight: 700;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      font-size: 16px;
      padding: 14px;
      transition: all .2s ease;
    }

    body.sidebar-collapsed .container {
      grid-template-columns: 86px minmax(0, 1fr);
    }

    body.sidebar-collapsed .sidebar {
      padding-right: 8px;
    }

    body.sidebar-collapsed .menu-btn {
      justify-content: center;
      padding: 12px 8px;
      min-height: 50px;
    }

    body.sidebar-collapsed .menu-btn span:last-child {
      display: none;
    }

    .icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--button-bg);
      flex-shrink: 0;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      margin: 0 0 12px;
      background: transparent;
      color: var(--button-bg);
      font-weight: 700;
      border-radius: 0;
      font-size: 15px;
    }

    .card { background: var(--card-bg); margin-top: 10px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .cards-grid .card {
      margin-top: 0;
    }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #e5e7eb; }
    .card-body { padding: 10px; }
    .muted { color: var(--hint-color); font-size: 13px; }
    .buy-btn { background: var(--button-bg); color: var(--button-text); margin-top: 8px; width: 100%; padding: 12px; font-weight: 700; }
    .panel { background: var(--card-bg); padding: 10px; border-radius: 12px; margin-top: 10px; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      box-sizing: border-box;
    }
    .hidden { display: none; }
    .summary {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      line-height: 1.5;
    }
    .secondary-btn {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      margin-top: 8px;
      width: 100%;
      padding: 12px;
      font-weight: 700;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .pagination-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }
    .pagination-row .secondary-btn {
      margin-top: 0;
      width: auto;
      flex: 1;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      margin-top: 10px;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      font-size: 14px;
    }
    .report-table th,
    .report-table td {
      border-bottom: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .report-table th {
      background: color-mix(in srgb, var(--bg-color) 75%, var(--card-bg));
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .report-table tfoot td {
      font-weight: 700;
      background: color-mix(in srgb, var(--bg-color) 70%, var(--card-bg));
      border-top: 2px solid var(--border-color);
    }
    .status-badge {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid transparent;
      vertical-align: middle;
    }
    .status-open {
      background: #f59e0b;
      border-color: #d97706;
    }
    .status-closed {
      background: #16a34a;
      border-color: #15803d;
    }
    .status-canceled {
      background: #dc2626;
      border-color: #b91c1c;
    }
    .status-unknown {
      background: #9ca3af;
      border-color: #6b7280;
    }
    .table-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
    }
    .mini-btn {
      width: auto;
      margin-top: 0;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      font-weight: 700;
    }
    .danger-btn {
      background: #dc2626;
      color: #ffffff;
      border: 1px solid #b91c1c;
    }
    .danger-btn:hover {
      background: #b91c1c;
    }
    .addr-cell {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 180px;
    }
    .eye-btn {
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-color);
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 13px;
      line-height: 1;
    }
    .suggestions {
      margin-top: 6px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      overflow: hidden;
    }
    .suggestion-item {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-color);
      text-align: left;
      padding: 10px;
      font-size: 14px;
      border-radius: 0;
    }
    .suggestion-item:last-child {
      border-bottom: none;
    }

    .contact-list {
      display: grid;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
    }

    .contact-item .icon {
      margin-top: 1px;
    }

    .cash-top {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px 10px;
      font-weight: 700;
    }

    .icon-btn {
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-color);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .cash-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 16px;
    }

    .cash-modal-card {
      width: min(100%, 420px);
    }

    .cash-ops-filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
      align-items: end;
    }

    .cash-ops-meta {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cash-ops-pager {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cash-ops-pager .secondary-btn {
      width: auto;
      margin-top: 0;
      padding: 8px 12px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 12px;
      }

      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .cash-ops-filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card panel">
      <h3>Admin kirish</h3>
      <input id="loginId" type="number" placeholder="Telegram admin ID" />
      <input id="loginPassword" type="password" placeholder="Parol" />
      <button class="buy-btn" onclick="loginAdmin()">Kirish</button>
      <div id="loginError" class="muted" style="margin-top:8px;color:#b91c1c;"></div>
    </div>
  </div>
  <div id="cashEditModal" class="cash-modal" onclick="closeCashEditModal(event)">
    <div class="panel cash-modal-card" onclick="event.stopPropagation()">
      <h3>Kassani tahrirlash</h3>
      <input id="topCashEditAmount" type="number" step="0.01" placeholder="Kassa summasi" />
      <button class="buy-btn" onclick="saveCashboxFromModal()">Saqlash</button>
      <button class="secondary-btn" onclick="closeCashEditModal()">Bekor qilish</button>
    </div>
  </div>
  <div id="productEditModal" class="cash-modal" onclick="closeProductEditModal(event)">
    <div class="panel cash-modal-card" onclick="event.stopPropagation()">
      <h3>Mahsulotni tahrirlash</h3>
      <input id="productEditName" placeholder="Nomi" />
      <input id="productEditPrice" type="number" step="0.01" placeholder="Narx (1kg)" />
      <input id="productEditStock" type="number" step="0.001" placeholder="Sklad (tonna)" />
      <input id="productEditPhoto" type="file" accept="image/*" />
      <button class="buy-btn" onclick="saveProductEditModal()">Saqlash</button>
      <button class="secondary-btn" onclick="closeProductEditModal()">Bekor qilish</button>
    </div>
  </div>
  <div id="addressModal" class="cash-modal" onclick="closeAddressModal(event)">
    <div class="panel cash-modal-card" onclick="event.stopPropagation()">
      <h3>To'liq manzil</h3>
      <div id="addressModalText" class="summary" style="margin-top:0;white-space:normal;word-break:break-word;"></div>
      <button class="secondary-btn" onclick="closeAddressModal()">Yopish</button>
    </div>
  </div>
  <div class="app-shell">
    <header>
      <div class="brand">
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Sidebarni yopish/ochish">☰</button>
        <img class="brand-logo" src="/img/logo.png" alt="Shrot Savdo logo" /><span class="brand-title">Pet Agro</span>
      </div>
      <div class="cash-top">
        <span>Kassa: <span id="topCashAmount">...</span> so'm</span>
        <button class="icon-btn" onclick="openCashEditModal()" title="Kassani tahrirlash">✎</button>
      </div>
    </header>
    <div class="container">
      <aside class="sidebar"><div id="menu" class="grid"></div></aside>
      <main class="main-area"><div id="content"></div></main>
    </div>
  </div>

<script>
const tg = {
  themeParams: {},
  onEvent: () => {},
  showAlert: (text) => window.alert(text),
  showConfirm: (text, cb) => cb(window.confirm(text))
};

const ICONS = {
  products: '<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"></path><path d="M3 7v10l9 4 9-4V7"></path><path d="M12 11v10"></path></svg>',
  contact: '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.8l-1.2 1.2a16 16 0 0 0 4.4 4.4l1.2-1.2a2 2 0 0 1 1.8-.6l3 .5a2 2 0 0 1 1.7 2z"></path></svg>',
  stats: '<svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M10 19V9"></path><path d="M16 19V12"></path><path d="M22 19V3"></path></svg>',
  orders: '<svg viewBox="0 0 24 24"><path d="M9 3h6"></path><path d="M8 7h8"></path><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 12h8"></path><path d="M8 16h5"></path></svg>',
  create: '<svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>',
  reports: '<svg viewBox="0 0 24 24"><path d="M4 19h16"></path><path d="M7 16l3-3 3 2 4-5"></path><path d="M7 8h.01"></path></svg>',
  myOrders: '<svg viewBox="0 0 24 24"><path d="M3 7h18"></path><path d="M5 7l1 12h12l1-12"></path><path d="M9 11h6"></path><path d="M9 15h4"></path></svg>',
  warehouse: '<svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"></path><path d="M4 10h16v10H4z"></path><path d="M9 20v-6h6v6"></path></svg>',
  cash: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>'
  ,phone: '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.8l-1.2 1.2a16 16 0 0 0 4.4 4.4l1.2-1.2a2 2 0 0 1 1.8-.6l3 .5a2 2 0 0 1 1.7 2z"></path></svg>'
  ,location: '<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-11a6 6 0 1 1 12 0c0 5.8-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg>'
};

let userId = '';
let role = 'admin';
let adminToken = localStorage.getItem('admin_token') || '';
let reportsEntriesCache = [];
let reportsSearchQuery = '';
let selectedClient = null;
let clientSearchSeq = 0;
let editingProductId = null;
let cashOperationsPage = 1;
const CASH_OPERATIONS_PAGE_SIZE = 50;
let cashOperationsStartDate = '';
let cashOperationsEndDate = '';
let activeSection = '';
let ordersEventsSource = null;
let ordersEventsReconnectTimer = null;
let ordersAutoRefreshInFlight = false;
let ordersAutoRefreshWindowUntil = 0;
let ordersAutoRefreshWindowTimer = null;
const ORDERS_AUTO_REFRESH_WINDOW_MS = 10_000;
const ORDERS_AUTO_REFRESH_POLL_MS = 2_000;

function resetAdminSession() {
  localStorage.removeItem('admin_token');
  adminToken = '';
  stopOrdersAutoRefresh();
  const overlay = document.getElementById('loginOverlay');
  if (overlay) overlay.style.display = 'flex';
}

async function hasValidAdminSession() {
  if (!adminToken) return false;
  try {
    const res = await fetch('/admin/api/me', {
      headers: {'Content-Type': 'application/json', 'X-Admin-Token': adminToken}
    });
    return res.ok;
  } catch {
    return false;
  }
}

function applySidebarState() {
  const collapsed = localStorage.getItem('admin_sidebar_collapsed') === '1';
  document.body.classList.toggle('sidebar-collapsed', collapsed);
}

function toggleSidebar() {
  const collapsed = !document.body.classList.contains('sidebar-collapsed');
  document.body.classList.toggle('sidebar-collapsed', collapsed);
  localStorage.setItem('admin_sidebar_collapsed', collapsed ? '1' : '0');
}

function applyTheme() {
  const root = document.documentElement;
  const theme = tg.themeParams || {};
  root.style.setProperty('--tg-theme-bg-color', theme.bg_color || '#f4f6f8');
  root.style.setProperty('--tg-theme-secondary-bg-color', theme.secondary_bg_color || '#ffffff');
  root.style.setProperty('--tg-theme-text-color', theme.text_color || '#1f2937');
  root.style.setProperty('--tg-theme-hint-color', theme.hint_color || '#6b7280');
  root.style.setProperty('--tg-theme-button-color', theme.button_color || '#0f766e');
  root.style.setProperty('--tg-theme-button-text-color', theme.button_text_color || '#ffffff');
}

applyTheme();

async function api(path, options={}) {
  const headers = {'Content-Type':'application/json', ...(options.headers || {})};
  if (adminToken) headers['X-Admin-Token'] = adminToken;
  const res = await fetch(path, {...options, headers});
  const rawText = await res.text();
  let payload = null;
  try {
    payload = rawText ? JSON.parse(rawText) : null;
  } catch {
    payload = null;
  }
  if (!res.ok) {
    const errorMessage = payload?.error || rawText || `HTTP ${res.status}`;
    throw new Error(errorMessage);
  }
  return payload || {};
}

async function refreshTopCash() {
  if (!userId) return;
  try {
    const data = await api(`/webapp/api/cashbox?tg_id=${userId}`);
    const node = document.getElementById('topCashAmount');
    if (node) node.textContent = formatMoney(data.amount || 0);
  } catch {
    const node = document.getElementById('topCashAmount');
    if (node) node.textContent = 'xato';
  }
}

function showFatalError(message) {
  document.getElementById('menu').classList.add('hidden');
  setContent(`
    <div class="panel">
      <b>⚠️ Web ilovani yuklab bo'lmadi</b><br><br>
      <div class="muted">${escapeHtml(message || 'Noma’lum xatolik')}</div>
      <button class="buy-btn" onclick="init()">Qayta urinish</button>
    </div>
  `);
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function showMainMenu() {
  setContent('');
}

function showSection(html) {
  setContent(html);
  refreshTopCash();
}

function stopOrdersAutoRefresh() {
  if (ordersEventsReconnectTimer) {
    clearTimeout(ordersEventsReconnectTimer);
    ordersEventsReconnectTimer = null;
  }
  if (ordersAutoRefreshWindowTimer) {
    clearInterval(ordersAutoRefreshWindowTimer);
    ordersAutoRefreshWindowTimer = null;
  }
  ordersAutoRefreshWindowUntil = 0;
  if (ordersEventsSource) {
    ordersEventsSource.close();
    ordersEventsSource = null;
  }
  ordersAutoRefreshInFlight = false;
}

async function triggerOrdersAutoRefreshTick() {
  if (activeSection !== 'orders') return;
  if (ordersAutoRefreshInFlight) return;
  ordersAutoRefreshInFlight = true;
  try {
    await loadOrders({preserveScroll: true});
  } catch {
    // no-op
  } finally {
    ordersAutoRefreshInFlight = false;
  }
}

function startTimedOrdersAutoRefreshWindow() {
  if (activeSection !== 'orders') return;
  const now = Date.now();
  ordersAutoRefreshWindowUntil = Math.max(ordersAutoRefreshWindowUntil, now + ORDERS_AUTO_REFRESH_WINDOW_MS);

  triggerOrdersAutoRefreshTick();

  if (ordersAutoRefreshWindowTimer) return;
  ordersAutoRefreshWindowTimer = setInterval(() => {
    if (activeSection !== 'orders') {
      clearInterval(ordersAutoRefreshWindowTimer);
      ordersAutoRefreshWindowTimer = null;
      ordersAutoRefreshWindowUntil = 0;
      return;
    }

    if (Date.now() >= ordersAutoRefreshWindowUntil) {
      clearInterval(ordersAutoRefreshWindowTimer);
      ordersAutoRefreshWindowTimer = null;
      ordersAutoRefreshWindowUntil = 0;
      return;
    }

    triggerOrdersAutoRefreshTick();
  }, ORDERS_AUTO_REFRESH_POLL_MS);
}

function startOrdersAutoRefresh() {
  if (role !== 'admin' || activeSection !== 'orders') return;
  if (!adminToken) return;
  if (ordersEventsSource) return;

  const connect = () => {
    if (activeSection !== 'orders') return;
    const streamUrl = `/admin/api/orders/stream?token=${encodeURIComponent(adminToken)}`;
    const source = new EventSource(streamUrl);
    ordersEventsSource = source;

    source.onmessage = async (event) => {
      let payload = null;
      try {
        payload = JSON.parse(event.data || '{}');
      } catch {
        payload = null;
      }
      if (!payload || payload.type !== 'order_created') return;
      if (payload.source !== 'bot_user') return;
      if (activeSection !== 'orders') return;
      startTimedOrdersAutoRefreshWindow();
    };

    source.onerror = async () => {
      source.close();
      if (ordersEventsSource === source) {
        ordersEventsSource = null;
      }
      if (activeSection !== 'orders') return;

      const isSessionValid = await hasValidAdminSession();
      if (!isSessionValid) {
        resetAdminSession();
        return;
      }

      if (ordersEventsReconnectTimer) clearTimeout(ordersEventsReconnectTimer);
      ordersEventsReconnectTimer = setTimeout(() => {
        ordersEventsReconnectTimer = null;
        startOrdersAutoRefresh();
      }, 2000);
    };
  };

  connect();
}

function formatMoney(value) {
  return Number(value || 0).toLocaleString('ru-RU');
}

function formatDateTime(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  return d.toLocaleString('ru-RU', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  });
}

function formatDateOnly(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  return d.toLocaleDateString('ru-RU', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  });
}

function truncateAddress(value, limit = 7) {
  const text = String(value || '');
  if (text.length <= limit) return text;
  return `${text.slice(0, limit)}...`;
}

async function fileToDataUrl(file) {
  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error("Rasmni o'qib bo'lmadi"));
    reader.readAsDataURL(file);
  });
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderStatsList(items, key) {
  if (!Array.isArray(items) || !items.length) {
    return "<div class='panel'>Hozircha ma'lumot yo'q.</div>";
  }
  return `
    <div class="panel">
      ${items.map((item, idx) => {
        const metric = Number(item?.[key] || 0);
        return `${idx + 1}. ${escapeHtml(item.name)} (${escapeHtml(item.phone)}) — ${metric} ta`;
      }).join('<br>')}
    </div>
  `;
}

function calculateTotal(pricePerKg, qtyTons) {
  const tons = Number(String(qtyTons).replace(',', '.'));
  if (!Number.isFinite(tons) || tons <= 0) return null;
  return tons * 1000 * Number(pricePerKg || 0);
}

function updateOrderTotal(productPricePerKg) {
  const qtyValue = document.getElementById('qty')?.value || '';
  const totalNode = document.getElementById('totalAmount');
  const total = calculateTotal(productPricePerKg, qtyValue);
  if (!totalNode) return;
  totalNode.textContent = total === null
    ? 'Jami summa: —'
    : `Jami summa: ${formatMoney(total)} soʻm`;
}

function statusMeta(status) {
  if (status === 'open') return {label: '🟠 Kutilmoqda', color: '#f59e0b'};
  if (status === 'closed') return {label: '🟢 Qabul qilingan', color: '#16a34a'};
  if (status === 'canceled') return {label: '🔴 Bekor qilingan', color: '#dc2626'};
  return {label: status || 'Nomaʼlum', color: 'var(--hint-color)'};
}

function previewOrder(productId, productName, productPricePerKg) {
  const quantity = (document.getElementById('qty')?.value || '').trim();
  const address = (document.getElementById('addr')?.value || '').trim();
  const clientName = (document.getElementById('clientName')?.value || '').trim();
  const clientPhone = (document.getElementById('clientPhone')?.value || '').trim();
  const total = calculateTotal(productPricePerKg, quantity);
  if (!quantity) return tg.showAlert('Iltimos, tonna miqdorini kiriting.');
  if (!address) return tg.showAlert('Iltimos, manzilni kiriting.');
  if (total === null) return tg.showAlert('Miqdor notoʻgʻri kiritildi.');
  if (role === 'admin' && (!clientName || !clientPhone)) {
    return tg.showAlert('Mijoz ismi va raqamini kiriting.');
  }

  const formFields = document.getElementById('formFields') || document.getElementById('quickOrderFormFields');
  const previewBtn = document.getElementById('previewBtn') || document.getElementById('quickPreviewBtn');
  const quickCreateBtn = document.getElementById('quickCreateBtn');
  const confirmBlock = document.getElementById('confirmBlock');
  if (formFields) formFields.classList.add('hidden');
  if (previewBtn) previewBtn.classList.add('hidden');
  if (quickCreateBtn) quickCreateBtn.classList.add('hidden');
  if (!confirmBlock) return;
  confirmBlock.classList.remove('hidden');
  confirmBlock.innerHTML = `
    <div class="summary">
      <b>Tasdiqlashdan oldin tekshiring:</b><br>
      Mahsulot: <b>${productName}</b><br>
      ${role === 'admin' ? `Mijoz: <b>${clientName}</b><br>Telefon: <b>${clientPhone}</b><br>` : ''}
      Miqdor: <b>${quantity} tonna</b><br>
      Manzil: <b>${address}</b><br>
      Umumiy summa: <b>${formatMoney(total)} soʻm</b>
    </div>
    <button class="buy-btn" onclick="submitOrder(${productId}, '${productName.replace(/'/g, "\\'")}', ${productPricePerKg})">Tasdiqlash va buyurtma yaratish</button>
    <button class="secondary-btn" onclick="hidePreview()">Tahrirlash</button>
  `;
}

function hidePreview() {
  const formFields = document.getElementById('formFields') || document.getElementById('quickOrderFormFields');
  const previewBtn = document.getElementById('previewBtn') || document.getElementById('quickPreviewBtn');
  const quickCreateBtn = document.getElementById('quickCreateBtn');
  const confirmBlock = document.getElementById('confirmBlock');
  const quickOrderPanel = document.getElementById('quickOrderPanel');
  if (formFields) formFields.classList.remove('hidden');

  updateQuickCreateButtonState(Boolean(quickOrderPanel && !quickOrderPanel.classList.contains('hidden')));

  confirmBlock.classList.add('hidden');

async function submitOrder(productId, productName, productPricePerKg) {
  const quantity = (document.getElementById('qty')?.value || '').trim();
  const address = (document.getElementById('addr')?.value || '').trim();
  const clientName = (document.getElementById('clientName')?.value || '').trim();
  const clientPhone = (document.getElementById('clientPhone')?.value || '').trim();
  const clientInfo = role === 'admin'
    ? (selectedClient || {name: clientName, phone: clientPhone})
    : null;
  try {
    const data = await api('/webapp/api/orders', {method:'POST', body:JSON.stringify({
      tg_id:userId,
      product_id:productId,
      quantity,
      address,
      selected_user_id: selectedClient?.id || null,
      client_name: clientName || null,
      client_phone: clientPhone || null
    })});
    const total = calculateTotal(productPricePerKg, quantity);
    tg.showAlert(`Buyurtma qabul qilindi.\nMahsulot: ${productName}${clientInfo ? `\nMijoz: ${clientInfo.name} (${clientInfo.phone})` : ''}\nMiqdor: ${quantity} tonna\nManzil: ${address}\nUmumiy summa: ${formatMoney(total)} soʻm\nID: ${data.order_id}`);
    openOrderForm(productId, productName, productPricePerKg);
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

async function cancelOrder(orderId) {
  const confirmed = await new Promise((resolve) => {
    if (typeof tg.showConfirm === 'function') {
      tg.showConfirm('Siz rostdan ham buyurtmani bekor qilmoqchimisiz?', resolve);
      return;
    }
    resolve(window.confirm('Siz rostdan ham buyurtmani bekor qilmoqchimisiz?'));
  });
  if (!confirmed) return;

  try {
    await api(`/webapp/api/orders/${orderId}/cancel`, {
      method:'POST',
      body:JSON.stringify({tg_id:userId})
    });
    tg.showAlert('Buyurtma bekor qilindi.');
    await loadOrders();
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

let ordersCache = [];
let ordersSearchQuery = '';
let ordersStatusFilter = 'all';
let ordersPaymentFilter = 'all';
let ordersPage = 1;
let ordersPageSize = 15;
let ordersPagination = null;
let quickOrderProducts = [];


function updateQuickCreateButtonState(isOpen) {
  const button = document.getElementById('quickCreateBtn');
  if (!button) return;
  button.textContent = isOpen ? 'Bekor qilish' : 'Buyurtma yaratish';
  button.classList.toggle('danger-btn', isOpen);

function toggleOrdersQuickCreate() {
  const panel = document.getElementById('quickOrderPanel');
  if (!panel) return;
  const shouldShow = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !shouldShow);
  updateQuickCreateButtonState(shouldShow);

      select.value = String(quickOrderProducts[0].id);

function onQuickOrderProductChange() {
  const selectNode = document.getElementById('quickOrderProduct');

function renderOrdersList() {
  const filtered = ordersCache.filter((order) => {
    const statusOk = ordersStatusFilter === 'all' || order.status === ordersStatusFilter;
    if (!statusOk) return false;
    if (ordersPaymentFilter === 'unpaid' && Number(order.remaining_amount_raw || 0) <= 0) return false;
    if (ordersPaymentFilter === 'partial' && Number(order.paid_amount_raw || 0) <= 0) return false;
    if (ordersPaymentFilter === 'partial' && Number(order.remaining_amount_raw || 0) <= 0) return false;
    if (!ordersSearchQuery) return true;
    const query = ordersSearchQuery.toLowerCase();
    const haystack = [
      order.product_name,
      order.quantity,
      order.address,
      order.client_name || '',
      order.client_phone || ''
    ].join(' ').toLowerCase();
    return haystack.includes(query);
  });

  const statusClass = (status) => {
    if (status === 'open') return 'status-open';
    if (status === 'closed') return 'status-closed';
    if (status === 'canceled') return 'status-canceled';
    return 'status-unknown';
  };

  const rows = filtered.map(o => {
    const statusLabel = o.status_label || statusMeta(o.status).label;
    const actionButtons = [];

    if (o.can_admin_manage) {
      actionButtons.push(`<button class="buy-btn mini-btn" onclick="adminUpdateOrderStatus(${o.id}, 'close')">Qabul qilish</button>`);
      actionButtons.push(`<button class="secondary-btn mini-btn" onclick="adminUpdateOrderStatus(${o.id}, 'cancel')">Bekor qilish</button>`);
    }

    if (role === 'admin' && o.status === 'closed') {
      actionButtons.push(`<button class="buy-btn mini-btn" onclick="addPaymentPrompt(${o.id})">To'lov qo'shish</button>`);
      actionButtons.push(`<button class="secondary-btn mini-btn" onclick="deletePaymentPrompt(${o.id})">To'lov o'chirish</button>`);
    }

    if (o.can_cancel) {
      actionButtons.push(`<button class="secondary-btn mini-btn" onclick="cancelOrder(${o.id})">Bekor qilish</button>`);
    }

    if (role === 'admin' && Number(o.payments_count || 0) === 0 && ['open', 'closed', 'canceled'].includes(o.status)) {
      actionButtons.push(`<button class="mini-btn danger-btn" onclick="deleteOrderByAdmin(${o.id})" title="Buyurtmani o'chirish">🗑</button>`);
    }

    return `
      <tr>
        <td>#${o.id}</td>
        <td>${escapeHtml(o.client_name || '—')}</td>
        <td>${escapeHtml(o.client_phone || '—')}</td>
        <td>${escapeHtml(o.product_name || '')}</td>
        <td>${escapeHtml(o.quantity || '')}</td>
        <td>${formatDateOnly(o.created_at)}</td>
        <td>
          <span class="addr-cell">
            <span>${escapeHtml(truncateAddress(o.address || '', 7))}</span>
            ${String(o.address || '').length > 7
              ? `<button class="eye-btn" title="To'liq manzil" data-address="${encodeURIComponent(String(o.address || ''))}" onclick="openAddressModalFromBtn(this)">👁</button>`
              : ''}
          </span>
        </td>
        <td>${formatMoney(Number(o.total_amount_raw ?? parseReportNumber(o.total_amount || 0)))} so'm</td>
        <td>${formatMoney(parseReportNumber(o.paid_amount || 0))} so'm</td>
        <td>${formatMoney(parseReportNumber(o.remaining_amount || 0))} so'm</td>
        <td>${o.payments_count || 0}</td>
        <td><span class="status-badge ${statusClass(o.status)}" title="${escapeHtml(statusLabel)}"></span></td>
        <td><div class="table-actions">${actionButtons.join('')}</div></td>
      </tr>
    `;
  }).join('');

  const listNode = document.getElementById('ordersList');
  if (listNode) {
    const pagination = ordersPagination || {};
    const pagerHtml = (pagination.total_pages || 1) > 1 ? `
      <div class="panel">

async function addPaymentPrompt(orderId) {
  const amountRaw = window.prompt("To'lov summasini kiriting (so'm). Bekor uchun bo'sh qoldiring:");
  if (amountRaw === null || String(amountRaw).trim() === '') return;
  const amount = Number(String(amountRaw).replace(/\s/g, '').replace(',', '.'));
  if (!Number.isFinite(amount) || amount <= 0) {
    tg.showAlert("To'g'ri summa kiriting.");
    return;
  }
  try {
    await api(`/webapp/api/orders/${orderId}/payments`, {
      method: 'POST',
      body: JSON.stringify({tg_id: userId, amount})
    });
    tg.showAlert("✅ To'lov qo'shildi.");
    await loadOrders();
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

async function deletePaymentPrompt(orderId) {
  try {
    const data = await api(`/webapp/api/orders/${orderId}/payments?tg_id=${userId}`);

    if (!payments.length) {
      tg.showAlert("Bu buyurtma uchun to'lovlar yo'q.");

      .slice(0, 10)

  }

async function adminUpdateOrderStatus(orderId, action) {

    const text = `Siz rostdan ham buyurtmani ${title} tasdiqlaysizmi?`;
    if (typeof tg.showConfirm === 'function') {

      return;

async function deleteOrderByAdmin(orderId) {
  const confirmed = await new Promise((resolve) => {
    const text = "To'lov qo'shilmagan bo'lsa, buyurtma o'chiriladi. Davom etasizmi?";
    if (typeof tg.showConfirm === 'function') {
      tg.showConfirm(text, resolve);
      return;
    }
    resolve(window.confirm(text));
  });
  if (!confirmed) return;

  try {
    const result = await api(`/webapp/api/orders/${orderId}/delete`, {
      method: 'POST',
      body: JSON.stringify({tg_id: userId})
    });
    if (result.result === 'closed_marked_canceled') {

async function loadCashbox() {
  activeSection = 'cash';
  stopOrdersAutoRefresh();
  const query = new URLSearchParams({
    tg_id: String(userId),
    page: String(cashOperationsPage),
    page_size: String(CASH_OPERATIONS_PAGE_SIZE)
  });
  if (cashOperationsStartDate) query.set('start_date', cashOperationsStartDate);
  if (cashOperationsEndDate) query.set('end_date', cashOperationsEndDate);

  const data = await api(`/webapp/api/cashbox?${query.toString()}`);
  const pagination = data.pagination || {};
  const operations = data.operations || [];

  const opsRows = operations.map((op, idx) => {
    const sign = op.operation_type === 'income' ? '+' : '-';
    const typeClass = op.operation_type === 'income' ? 'status-closed' : 'status-canceled';
    const typeTitle = op.operation_type === 'income' ? 'Kirim' : 'Chiqim';
    const noteText = op.note || op.reason || '—';
    const rowNumber = (Number(pagination.page || 1) - 1) * Number(pagination.page_size || CASH_OPERATIONS_PAGE_SIZE) + idx + 1;
    return `
      <tr>
        <td>${rowNumber}</td>
        <td>${formatDateTime(op.created_at)}</td>
        <td><span class="status-badge ${typeClass}" title="${typeTitle}"></span></td>
        <td>${sign}${escapeHtml(op.amount_label)} so'm</td>
        <td style="white-space:normal;word-break:break-word;max-width:320px;">${escapeHtml(noteText)}</td>
      </tr>
    `;
  }).join('');

  const opsTable = operations.length ? `
    <div class="table-wrap">
      <table class="report-table" style="min-width:760px;">
        <thead>
          <tr>
            <th>#</th>
            <th>Sana</th>
            <th>Turi</th>
            <th>Summa</th>
            <th>Izoh</th>
          </tr>
        </thead>
        <tbody>
          ${opsRows}
        </tbody>
      </table>
    </div>
  ` : "<div class='panel'>Operatsiyalar topilmadi.</div>";

  const page = Number(pagination.page || 1);
  const totalPages = Number(pagination.total_pages || 1);
  const total = Number(pagination.total || 0);
  const showCashPagination = total > CASH_OPERATIONS_PAGE_SIZE;

  showSection(`
    <div class="panel">
      <b>Kassa:</b> ${formatMoney(data.amount)} so'm
      <input id="cashboxAmount" type="number" step="0.01" value="${Number(data.amount || 0)}" />
      <button class="buy-btn" onclick="saveCashbox()">Kassani saqlash</button>
    </div>
    <div class="panel">
      <b>So'nggi operatsiyalar</b>
      <div class="cash-ops-filters">
        <div>
          <label for="cashOpsStartDate">Boshlanish sanasi</label>
          <input id="cashOpsStartDate" type="date" value="${escapeHtml(cashOperationsStartDate)}" />
        </div>
        <div>
          <label for="cashOpsEndDate">Tugash sanasi</label>
          <input id="cashOpsEndDate" type="date" value="${escapeHtml(cashOperationsEndDate)}" />
        </div>
      </div>
      <div class="cash-ops-filters" style="grid-template-columns:repeat(2, minmax(0, 1fr));margin-top:8px;">
        <button class="buy-btn" style="margin-top:0;" onclick="applyCashboxFilters()">Filtrlash</button>
        <button class="secondary-btn" style="margin-top:0;" onclick="resetCashboxFilters()">Filtrlarni tozalash</button>
      </div>
      ${opsTable}
      <div class="cash-ops-meta muted">
        <span>${showCashPagination ? `Jami: ${total} ta | Sahifa: ${page} / ${totalPages} | Har sahifada: ${CASH_OPERATIONS_PAGE_SIZE}` : `Jami: ${total} ta`}</span>
        ${showCashPagination ? `
          <div class="cash-ops-pager">
            <button class="secondary-btn" ${pagination.has_prev ? '' : 'disabled'} onclick="changeCashboxPage(-1)">⬅️ Oldingi</button>
            <button class="secondary-btn" ${pagination.has_next ? '' : 'disabled'} onclick="changeCashboxPage(1)">Keyingi ➡️</button>
          </div>
        ` : ''}
      </div>
    </div>
  `);
}

function getCurrentMonthRange() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return {
    startDate: `${year}-${month}-01`,
    endDate: `${year}-${month}-${day}`
  };
}

function parseReportNumber(value) {
  const normalized = String(value ?? '')
    .replace(/\s/g, '')
    .replace(/,/g, '');
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
}

function formatReportTons(value) {
  if (Math.abs(value - Math.round(value)) < 1e-9) {
    return String(Math.round(value));
  }
  return value.toFixed(2).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
}

function getFilteredReportEntries() {
  const normalizedQuery = reportsSearchQuery.toLowerCase();
  return reportsEntriesCache.filter((entry) => {
    if (!normalizedQuery) return true;
    const haystack = `${entry.client} ${entry.product}`.toLowerCase();
    return haystack.includes(normalizedQuery);
  });
}

function exportReportsPdf() {
  const filteredEntries = getFilteredReportEntries();
  if (!filteredEntries.length) {
    tg.showAlert("Eksport uchun ma'lumot yo'q.");
    return;
  }

  const totalTons = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.tons), 0);
  const totalAmount = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.amount), 0);
  const totalPaid = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.paid_amount), 0);
  const totalUnpaid = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.unpaid_amount), 0);

  const rowsHtml = filteredEntries.map((entry, idx) => `
    <tr>
      <td>${entry.order_id}</td>
      <td>${idx + 1}. ${escapeHtml(entry.client)}</td>
      <td>${escapeHtml(entry.product)}</td>
      <td style="text-align:right;">${escapeHtml(entry.tons)}</td>
      <td style="text-align:right;">${escapeHtml(entry.amount)}</td>
      <td style="text-align:right;">${escapeHtml(entry.paid_amount)}</td>
      <td style="text-align:right;">${escapeHtml(entry.unpaid_amount)}</td>
    </tr>
  `).join('');

  const period = escapeHtml(document.getElementById('reportsResult')?.dataset?.reportPeriod || '');
  const html = `
    <!doctype html>
    <html>
      <head>
        <meta charset="utf-8" />
        <title>Hisobot PDF</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 24px; }
          h2 { margin: 0 0 8px; }
          .meta { margin-bottom: 14px; color: #444; }
          table { width: 100%; border-collapse: collapse; font-size: 12px; }
          th, td { border: 1px solid #999; padding: 6px 8px; }
          th { background: #f2f2f2; }
          tfoot td { font-weight: 700; background: #fafafa; }
        </style>
      </head>
      <body>
        <h2>Hisobot</h2>
        <div class="meta">Davr: ${period}</div>
        <table>
          <thead>
            <tr>
              <th>Buyurtma ID</th>
              <th>Mijoz</th>
              <th>Mahsulot</th>
              <th>Tonna</th>
              <th>Jami summa</th>
              <th>To'langan</th>
              <th>To'lanmagan</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot>
            <tr>
              <td colspan="2">Jami</td>
              <td>—</td>
              <td style="text-align:right;">${formatReportTons(totalTons)}</td>
              <td style="text-align:right;">${formatMoney(totalAmount)}</td>
              <td style="text-align:right;">${formatMoney(totalPaid)}</td>
              <td style="text-align:right;">${formatMoney(totalUnpaid)}</td>
            </tr>
          </tfoot>
        </table>
      </body>
    </html>
  `;

  const periodSafe = String(period || 'hisobot').replace(/[^0-9A-Za-z._-]/g, '_');
  const fileName = `hisobot_${periodSafe}.html`;
  const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  api('/webapp/api/reports/send-pdf', {
    method: 'POST',
    body: JSON.stringify({
      tg_id: userId,
      period: document.getElementById('reportsResult')?.dataset?.reportPeriod || '',
      file_name: fileName,
      html,
    })
  })
    .then(() => tg.showAlert("✅ HTML fayl bot orqali ham yuborildi, va fayl ham yuklab olindi."))
    .catch((e) => tg.showAlert("⚠️ Fayl yuklab olindi, lekin botga yuborishda xato: " + e.message));
}

function renderReportsResult(data) {
  const filteredEntries = getFilteredReportEntries();

  const filteredTons = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.tons), 0);
  const filteredAmount = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.amount), 0);
  const filteredPaid = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.paid_amount), 0);
  const filteredUnpaid = filteredEntries.reduce((sum, entry) => sum + parseReportNumber(entry.unpaid_amount), 0);

  const emptyMessage = reportsSearchQuery
    ? "<div class='panel'>Qidiruv bo'yicha ma'lumot topilmadi.</div>"
    : "<div class='panel'>Tanlangan davr bo'yicha ma'lumot topilmadi.</div>";

  const rowsHtml = filteredEntries.map((entry) => `
    <tr>
      <td>#${entry.order_id}</td>
      <td>${escapeHtml(entry.client || '')}</td>
      <td>${escapeHtml(entry.product || '')}</td>
      <td>${escapeHtml(String(entry.tons || '0'))} t</td>
      <td>${formatDateTime(entry.created_at)}</td>
      <td>${formatMoney(parseReportNumber(entry.amount))} so'm</td>
      <td>${formatMoney(parseReportNumber(entry.paid_amount))} so'm</td>
      <td>${formatMoney(parseReportNumber(entry.unpaid_amount))} so'm</td>
    </tr>
  `).join('');

  const tableHtml = filteredEntries.length ? `
    <div class="table-wrap">
      <table class="report-table">
        <thead>
          <tr>
            <th>Buyurtma ID</th>
            <th>Mijoz</th>
            <th>Mahsulot</th>
            <th>Miqdor (tonna)</th>
            <th>Sana</th>
            <th>Jami summa</th>
            <th>To'langan</th>
            <th>To'lanmagan</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3">Jami</td>
            <td>${formatReportTons(filteredTons)} t</td>
            <td>—</td>
            <td>${formatMoney(filteredAmount)} so'm</td>
            <td>${formatMoney(filteredPaid)} so'm</td>
            <td>${formatMoney(filteredUnpaid)} so'm</td>
          </tr>
        </tfoot>
      </table>
    </div>
  ` : emptyMessage;

  const reportsNode = document.getElementById('reportsResult');
  if (reportsNode) {
    reportsNode.innerHTML = `
      <div class="panel">Davr: ${data.period}<br>Yopilgan buyurtmalar: ${filteredEntries.length}<br>Jami tonna: ${formatReportTons(filteredTons)} t<br>Jami summa: ${formatMoney(filteredAmount)} so'm<br>Shundan to'langan: ${formatMoney(filteredPaid)} so'm<br>Shundan to'lanmagan: ${formatMoney(filteredUnpaid)} so'm</div>
      ${tableHtml}
    `;
  }
}

function onReportsSearchInput(value) {
  reportsSearchQuery = String(value || '').trim();
  const reportsNode = document.getElementById('reportsResult');
  if (!reportsNode || !reportsNode.dataset.reportMeta) return;
  try {
    renderReportsResult(JSON.parse(reportsNode.dataset.reportMeta));
  } catch {
    // no-op
  }
}

async function applyReportsFilter() {
  const startDate = document.getElementById('reportStartDate')?.value;
  const endDate = document.getElementById('reportEndDate')?.value;
  if (!startDate || !endDate) {
    tg.showAlert('Iltimos, ikkala sanani ham kiriting.');
    return;
  }

  try {
    const data = await api(`/webapp/api/reports?tg_id=${userId}&start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}`);
    reportsEntriesCache = data.entries || [];
    const reportsNode = document.getElementById('reportsResult');
    if (reportsNode) {
      reportsNode.dataset.reportMeta = JSON.stringify(data);
      reportsNode.dataset.reportPeriod = String(data.period || '');
    }
    renderReportsResult(data);
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

async function loadReports() {
  activeSection = 'reports';
  stopOrdersAutoRefresh();
  const {startDate, endDate} = getCurrentMonthRange();
  reportsSearchQuery = '';

  showSection(`
    <div class="panel">
      <b>Hisobot davri</b>
      <input id="reportStartDate" type="date" value="${startDate}" />
      <input id="reportEndDate" type="date" value="${endDate}" />
      <button class="buy-btn" onclick="applyReportsFilter()">Hisobotni yangilash</button>
      <button class="secondary-btn" onclick="exportReportsPdf()">PDF eksport</button>
      <input id="reportsSearch" placeholder="Qidirish: mijoz ismi yoki telefon" oninput="onReportsSearchInput(this.value)" />
    </div>
    <div id="reportsResult"></div>
  `);

  await applyReportsFilter();
}
