<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shrot Savdo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f6f8);
      --text-color: var(--tg-theme-text-color, #1f2937);
      --hint-color: var(--tg-theme-hint-color, #6b7280);
      --header-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-bg: var(--tg-theme-button-color, #0f766e);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: var(--tg-theme-section-separator-color, #d1d5db);
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background .2s ease, color .2s ease;
    }

    header {
      background: var(--header-bg);
      color: var(--text-color);
      padding: 14px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
    }

    .container { padding: 12px; }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    button { border: none; border-radius: 12px; cursor: pointer; }

    .menu-btn {
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      color: var(--text-color);
      font-weight: 700;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      font-size: 16px;
      padding: 14px;
    }

    .icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--button-bg);
      flex-shrink: 0;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--button-bg);
      color: var(--button-text);
      font-weight: 700;
    }

    .card { background: var(--card-bg); margin-top: 10px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #e5e7eb; }
    .card-body { padding: 10px; }
    .muted { color: var(--hint-color); font-size: 13px; }
    .buy-btn { background: var(--button-bg); color: var(--button-text); margin-top: 8px; width: 100%; padding: 12px; font-weight: 700; }
    .panel { background: var(--card-bg); padding: 10px; border-radius: 12px; margin-top: 10px; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      box-sizing: border-box;
    }
    .hidden { display: none; }
    .summary {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      line-height: 1.5;
    }
    .secondary-btn {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      margin-top: 8px;
      width: 100%;
      padding: 12px;
      font-weight: 700;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>Shrot Savdo Web App</header>
  <div class="container">
    <div id="menu" class="grid"></div>
    <div id="content"></div>
  </div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const ICONS = {
  products: '<svg viewBox="0 0 24 24"><path d="M3 7h18"></path><path d="M6 7l1 12h10l1-12"></path><path d="M9 7V5a3 3 0 0 1 6 0v2"></path></svg>',
  contact: '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.8l-1.2 1.2a16 16 0 0 0 4.4 4.4l1.2-1.2a2 2 0 0 1 1.8-.6l3 .5a2 2 0 0 1 1.7 2z"></path></svg>',
  stats: '<svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M10 19V9"></path><path d="M16 19V12"></path><path d="M22 19V3"></path></svg>',
  orders: '<svg viewBox="0 0 24 24"><path d="M9 3h6"></path><path d="M8 7h8"></path><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 12h8"></path><path d="M8 16h5"></path></svg>',
  create: '<svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>',
  reports: '<svg viewBox="0 0 24 24"><path d="M4 19h16"></path><path d="M7 16l3-3 3 2 4-5"></path><path d="M7 8h.01"></path></svg>',
  myOrders: '<svg viewBox="0 0 24 24"><path d="M3 7h18"></path><path d="M5 7l1 12h12l1-12"></path><path d="M9 11h6"></path><path d="M9 15h4"></path></svg>'
};

const userId = tg.initDataUnsafe?.user?.id || new URLSearchParams(location.search).get('tg_id');
let role = 'user';

function applyTheme() {
  const root = document.documentElement;
  const theme = tg.themeParams || {};
  root.style.setProperty('--tg-theme-bg-color', theme.bg_color || '#f4f6f8');
  root.style.setProperty('--tg-theme-secondary-bg-color', theme.secondary_bg_color || '#ffffff');
  root.style.setProperty('--tg-theme-text-color', theme.text_color || '#1f2937');
  root.style.setProperty('--tg-theme-hint-color', theme.hint_color || '#6b7280');
  root.style.setProperty('--tg-theme-button-color', theme.button_color || '#0f766e');
  root.style.setProperty('--tg-theme-button-text-color', theme.button_text_color || '#ffffff');
}

applyTheme();
tg.onEvent('themeChanged', applyTheme);

async function api(path, options={}) {
  const res = await fetch(path, {headers:{'Content-Type':'application/json'}, ...options});
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function showMainMenu() {
  document.getElementById('menu').classList.remove('hidden');
  setContent('');
}

function showSection(html) {
  document.getElementById('menu').classList.add('hidden');
  setContent(`
    <button class="back-btn" onclick="showMainMenu()">← Orqaga</button>
    ${html}
  `);
}

function renderMenu(items) {
  const menu = document.getElementById('menu');
  menu.innerHTML = items.map(i => `
    <button class="menu-btn" onclick="${i.action}">
      <span class="icon">${i.icon}</span>
      <span>${i.label}</span>
    </button>
  `).join('');
}

async function loadProducts() {
  const data = await api(`/webapp/api/products?tg_id=${userId}`);
  if (!data.products.length) return showSection('<div class="panel">Mahsulotlar yoʻq.</div>');
  showSection(data.products.map(p => `
    <div class="card">
      <img src="${p.photo_url || ''}" onerror="this.style.display='none'" />
      <div class="card-body">
        <div><b>${p.name}</b></div>
        <div class="muted">${p.description || 'Tavsif yoʻq'}</div>
        <div><b>${p.price_per_kg} soʻm / kg</b></div>
        <button class="buy-btn" onclick="openOrderForm(${p.id}, '${(p.name||'').replace(/'/g,'')}', ${p.price_per_kg})">Sotib olish</button>
      </div>
    </div>
  `).join(''));
}

function formatMoney(value) {
  return Number(value || 0).toLocaleString('ru-RU');
}

function calculateTotal(pricePerKg, qtyTons) {
  const tons = Number(String(qtyTons).replace(',', '.'));
  if (!Number.isFinite(tons) || tons <= 0) return null;
  return tons * 1000 * Number(pricePerKg || 0);
}

function updateOrderTotal(productPricePerKg) {
  const qtyValue = document.getElementById('qty')?.value || '';
  const totalNode = document.getElementById('totalAmount');
  const total = calculateTotal(productPricePerKg, qtyValue);
  if (!totalNode) return;
  totalNode.textContent = total === null
    ? 'Jami summa: —'
    : `Jami summa: ${formatMoney(total)} soʻm`;
}

function statusMeta(status) {
  if (status === 'open') return {label: '🟠 Kutilmoqda', color: '#f59e0b'};
  if (status === 'closed') return {label: '🟢 Qabul qilingan', color: '#16a34a'};
  if (status === 'canceled') return {label: '🔴 Bekor qilingan', color: '#dc2626'};
  return {label: status || 'Nomaʼlum', color: 'var(--hint-color)'};
}

function openOrderForm(productId, productName, productPricePerKg) {
  showSection(`
    <div class="panel">
      <h3>Buyurtma: ${productName}</h3>
      <div id="formFields">
        <input id="qty" placeholder="Miqdor (tonna, masalan: 2.5)" oninput="updateOrderTotal(${productPricePerKg})" />
        <textarea id="addr" placeholder="Manzil"></textarea>
        <div id="totalAmount" class="summary">Jami summa: —</div>
      </div>
      <button id="previewBtn" class="buy-btn" onclick="previewOrder(${productId}, '${productName.replace(/'/g, "\\'")}', ${productPricePerKg})">Yuborish</button>
      <div id="confirmBlock" class="hidden"></div>
    </div>
  `);
}

function previewOrder(productId, productName, productPricePerKg) {
  const quantity = (document.getElementById('qty')?.value || '').trim();
  const address = (document.getElementById('addr')?.value || '').trim();
  const total = calculateTotal(productPricePerKg, quantity);
  if (!quantity) return tg.showAlert('Iltimos, tonna miqdorini kiriting.');
  if (!address) return tg.showAlert('Iltimos, manzilni kiriting.');
  if (total === null) return tg.showAlert('Miqdor notoʻgʻri kiritildi.');

  const formFields = document.getElementById('formFields');
  const previewBtn = document.getElementById('previewBtn');
  const confirmBlock = document.getElementById('confirmBlock');
  if (formFields) formFields.classList.add('hidden');
  if (previewBtn) previewBtn.classList.add('hidden');
  confirmBlock.classList.remove('hidden');
  confirmBlock.innerHTML = `
    <div class="summary">
      <b>Tasdiqlashdan oldin tekshiring:</b><br>
      Mahsulot: <b>${productName}</b><br>
      Miqdor: <b>${quantity} tonna</b><br>
      Manzil: <b>${address}</b><br>
      Umumiy summa: <b>${formatMoney(total)} soʻm</b>
    </div>
    <button class="buy-btn" onclick="submitOrder(${productId}, '${productName.replace(/'/g, "\\'")}', ${productPricePerKg})">Tasdiqlash va buyurtma yaratish</button>
    <button class="secondary-btn" onclick="hidePreview()">Tahrirlash</button>
  `;
}

function hidePreview() {
  const formFields = document.getElementById('formFields');
  const previewBtn = document.getElementById('previewBtn');
  const confirmBlock = document.getElementById('confirmBlock');
  if (formFields) formFields.classList.remove('hidden');
  if (previewBtn) previewBtn.classList.remove('hidden');
  confirmBlock.classList.add('hidden');
  confirmBlock.innerHTML = '';
}

async function submitOrder(productId, productName, productPricePerKg) {
  const quantity = (document.getElementById('qty')?.value || '').trim();
  const address = (document.getElementById('addr')?.value || '').trim();
  try {
    const data = await api('/webapp/api/orders', {method:'POST', body:JSON.stringify({tg_id:userId, product_id:productId, quantity, address})});
    const total = calculateTotal(productPricePerKg, quantity);
    tg.showAlert(`Buyurtma qabul qilindi.\nMahsulot: ${productName}\nMiqdor: ${quantity} tonna\nManzil: ${address}\nUmumiy summa: ${formatMoney(total)} soʻm\nID: ${data.order_id}`);
    openOrderForm(productId, productName, productPricePerKg);
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

async function cancelOrder(orderId) {
  const confirmed = await new Promise((resolve) => {
    if (typeof tg.showConfirm === 'function') {
      tg.showConfirm('Siz rostdan ham buyurtmani bekor qilmoqchimisiz?', resolve);
      return;
    }
    resolve(window.confirm('Siz rostdan ham buyurtmani bekor qilmoqchimisiz?'));
  });
  if (!confirmed) return;

  try {
    await api(`/webapp/api/orders/${orderId}/cancel`, {
      method:'POST',
      body:JSON.stringify({tg_id:userId})
    });
    tg.showAlert('Buyurtma bekor qilindi.');
    await loadOrders();
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

let ordersCache = [];
let ordersSearchQuery = '';
let ordersStatusFilter = 'all';

function renderOrdersList() {
  const filtered = ordersCache.filter((order) => {
    const statusOk = ordersStatusFilter === 'all' || order.status === ordersStatusFilter;
    if (!statusOk) return false;
    if (!ordersSearchQuery) return true;
    const query = ordersSearchQuery.toLowerCase();
    const haystack = [
      order.product_name,
      order.quantity,
      order.address,
      order.client_name || '',
      order.client_phone || ''
    ].join(' ').toLowerCase();
    return haystack.includes(query);
  });

  const cards = filtered.map(o => {
    const meta = statusMeta(o.status);
    const statusLabel = o.status_label || meta.label;
    return `
      <div class="panel">
        <div><b>Buyurtma #${o.id}</b></div>
        ${o.client_name ? `<div>👤 Mijoz: <b>${o.client_name}</b></div>` : ''}
        ${o.client_phone ? `<div>📞 Telefon: <b>${o.client_phone}</b></div>` : ''}
        <div>📦 Mahsulot: <b>${o.product_name}</b></div>
        <div>⚖️ Miqdor: <b>${o.quantity}</b></div>
        <div>📍 Manzil: <b>${o.address}</b></div>
        <div>💵 Jami summa: <b>${o.total_amount}</b></div>
        <div style="margin-top:6px;color:${meta.color};font-weight:700;">Holat: ${statusLabel}</div>
        ${o.can_admin_manage ? `
          <button class="buy-btn" onclick="adminUpdateOrderStatus(${o.id}, 'close')">Qabul qilish</button>
          <button class="secondary-btn" onclick="adminUpdateOrderStatus(${o.id}, 'cancel')">Bekor qilish</button>
        ` : ''}
        ${o.can_cancel ? `<button class="secondary-btn" onclick="cancelOrder(${o.id})">Buyurtmani bekor qilish</button>` : ''}
      </div>
    `;
  }).join('');

  const listNode = document.getElementById('ordersList');
  if (listNode) {
    listNode.innerHTML = cards || '<div class="panel">Buyurtmalar yoʻq.</div>';
  }
}

function onOrdersStatusChange(value) {
  ordersStatusFilter = value || 'all';
  renderOrdersList();
}

function onOrdersSearchInput(value) {
  ordersSearchQuery = String(value || '').trim();
  renderOrdersList();
}

async function adminUpdateOrderStatus(orderId, action) {
  const title = action === 'close' ? 'qabul qilishni' : 'bekor qilishni';
  const confirmed = await new Promise((resolve) => {
    const text = `Siz rostdan ham buyurtmani ${title} tasdiqlaysizmi?`;
    if (typeof tg.showConfirm === 'function') {
      tg.showConfirm(text, resolve);
      return;
    }
    resolve(window.confirm(text));
  });
  if (!confirmed) return;

  try {
    await api(`/webapp/api/orders/${orderId}/admin-status`, {
      method:'POST',
      body:JSON.stringify({tg_id:userId, action})
    });
    tg.showAlert(action === 'close' ? 'Buyurtma qabul qilindi.' : 'Buyurtma bekor qilindi.');
    await loadOrders();
  } catch (e) {
    tg.showAlert('Xato: ' + e.message);
  }
}

async function loadOrders() {
  const data = await api(`/webapp/api/orders?tg_id=${userId}`);
  ordersCache = data.orders || [];
  ordersSearchQuery = '';
  ordersStatusFilter = 'all';

  const searchPlaceholder = role === 'admin'
    ? 'Qidirish: mijoz ismi yoki telefon...'
    : 'Qidirish: mahsulot, manzil...';

  showSection(`
    <div class="filters panel">
      <input id="ordersSearch" placeholder="${searchPlaceholder}" oninput="onOrdersSearchInput(this.value)" />
      <div class="filter-row">
        <select id="statusFilter" onchange="onOrdersStatusChange(this.value)">
          <option value="all">Barchasi</option>
          <option value="open">🟠 Ochiq</option>
          <option value="closed">🟢 Qabul qilingan</option>
          <option value="canceled">🔴 Bekor qilingan</option>
        </select>
      </div>
    </div>
    <div id="ordersList"></div>
  `);

  renderOrdersList();
}

async function loadStats() {
  const data = await api(`/webapp/api/stats?tg_id=${userId}`);
  showSection(`<div class="panel">Jami foydalanuvchilar: ${data.users}<br>Jami buyurtmalar: ${data.orders}<br>Ochiq: ${data.open_orders}<br>Yopilgan: ${data.closed_orders}</div>`);
}

async function loadReports() {
  const data = await api(`/webapp/api/reports?tg_id=${userId}`);
  showSection(`<div class="panel">Davr: ${data.period}<br>Yopilgan buyurtmalar: ${data.closed_orders}<br>Jami summa: ${data.total_amount}</div>`);
}

function showContact() {
  showSection('<div class="panel">☎️ +998955309999<br>☎️ +998953309999</div>');
}

async function init() {
  const boot = await api(`/webapp/api/bootstrap?tg_id=${userId}`);
  role = boot.role;

  if (role === 'admin') {
    renderMenu([
      {label:'Mahsulotlar', icon:ICONS.products, action:'loadProducts()'},
      {label:'Aloqa', icon:ICONS.contact, action:'showContact()'},
      {label:'Statistika', icon:ICONS.stats, action:'loadStats()'},
      {label:"Buyurtmalar ro\'yxati", icon:ICONS.orders, action:'loadOrders()'},
      {label:'Buyurtma yaratish', icon:ICONS.create, action:'loadProducts()'},
      {label:'Hisobotlar', icon:ICONS.reports, action:'loadReports()'}
    ]);
  } else {
    renderMenu([
      {label:'Mahsulotlar', icon:ICONS.products, action:'loadProducts()'},
      {label:'Mening buyurtmalarim', icon:ICONS.myOrders, action:'loadOrders()'},
      {label:'Aloqa', icon:ICONS.contact, action:'showContact()'}
    ]);
  }

  showMainMenu();
}

init();
</script>
</body>
</html>
